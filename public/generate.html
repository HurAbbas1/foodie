<!DOCTYPE html>
<html>
  <head>
    <title>MenuVerse AR Marker Generator</title>
    <script src="https://raw.githack.com/AR-js-org/Marker-Creator/main/dist/marker-creator.umd.js"></script>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #09090b;
        color: #f4f4f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
      }
      .card {
        background: #18181b;
        border: 1px solid #27272a;
        padding: 30px;
        border-radius: 20px;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      }
      h1 { color: #f59e0b; margin-top: 0; }
      .btn {
        background: #f59e0b;
        color: #09090b;
        border: none;
        padding: 12px 24px;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
        margin-top: 20px;
        transition: transform 0.2s;
      }
      .btn:hover { transform: scale(1.02); }
      #marker-preview {
        margin: 20px 0;
        border: 1px solid #3f3f46;
        background: white;
        padding: 10px;
        border-radius: 10px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>MenuVerse AR Marker Generator</h1>
      <p>This utility will generate your custom AR marker and pattern file using the MenuVerse logo badge.</p>
      
      <!-- Preview of the generated marker -->
      <div id="marker-preview">
        <canvas id="marker-canvas" width="400" height="400"></canvas>
      </div>

      <p style="font-size: 12px; color: #a1a1aa;">
        Click below to generate and save <code>logo.patt</code> and <code>logo-marker.png</code> directly to your project's <code>public/</code> folder.
      </p>

      <button id="btn-generate" class="btn">Generate & Save Marker Files</button>
      <div id="status" style="margin-top: 15px; font-size: 13px; color: #f59e0b;">Ready</div>
    </div>

    <script>
      const canvas = document.getElementById('marker-canvas');
      const ctx = canvas.getContext('2d');
      const btn = document.getElementById('btn-generate');
      const statusDiv = document.getElementById('status');

      // Create the printable marker image
      // AR.js markers need a thick black border around a white inner square, which contains the logo
      function drawMarker(logoImg) {
        // Fill canvas with white
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 400, 400);

        // Draw thick black border (outer 25% is black border)
        // A standard AR.js marker has border size 0.5 (50% of the total width is border)
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, 400, 400);
        
        // Inner white square
        // Border size is typically 20% on each side, so x goes from 80 to 320
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(80, 80, 240, 240);

        // Draw the circular logo inside the inner white square (size 180x180, centered)
        ctx.drawImage(logoImg, 110, 110, 180, 180);
      }

      // Function to remove white canvas background from the badge image to make it transparent
      function makeLogoTransparent(img) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = img.naturalWidth || img.width;
        tempCanvas.height = img.naturalHeight || img.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(img, 0, 0);

        const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i+1];
          const b = data[i+2];

          // If pixel is pure white or very close to white background, make it transparent
          if (r > 248 && g > 248 && b > 248) {
            data[i+3] = 0; // Set alpha channel to 0 (transparent)
          }
        }

        tempCtx.putImageData(imgData, 0, 0);
        return tempCanvas.toDataURL('image/png');
      }

      const logo = new Image();
      logo.src = '/logo-badge.jpg';
      logo.onload = () => {
        drawMarker(logo);
      };

      btn.addEventListener('click', () => {
        statusDiv.innerText = "Encoding pattern...";

        // Extract the inner pattern image (only the white square content at 80, 80, size 240x240)
        // to train the .patt file
        const patternCanvas = document.createElement('canvas');
        patternCanvas.width = 16;
        patternCanvas.height = 16;
        const pCtx = patternCanvas.getContext('2d');
        
        // Resize the inner white square + logo to 16x16 to match artoolkit format
        pCtx.drawImage(canvas, 80, 80, 240, 240, 0, 0, 16, 16);
        
        const patternDataUrl = patternCanvas.toDataURL('image/png');

        // Use MarkerCreator to encode the image to pattern file format
        window.MarkerCreator.ArPatternFile.encodeImageURL(patternDataUrl, function(patternFileString) {
          statusDiv.innerText = "Saving files to local server...";

          const markerBase64 = canvas.toDataURL('image/png');
          
          // Generate transparent background version of the badge logo
          const transparentLogoBase64 = makeLogoTransparent(logo);

          // Send to Next.js API to save locally
          fetch('/api/save-marker', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              pattString: patternFileString,
              markerBase64: markerBase64,
              transparentLogoBase64: transparentLogoBase64
            })
          })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              statusDiv.innerText = "Success! Generated 'logo.patt', 'logo-marker.png', and transparent 'logo-badge-transparent.png' in your public/ directory.";
            } else {
              statusDiv.innerText = "Error: " + data.error;
            }
          })
          .catch(err => {
            statusDiv.innerText = "Network error saving marker files: " + err.message;
          });
        });
      });
    </script>
  </body>
</html>
