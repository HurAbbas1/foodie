<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MenuVerse 3D AR Experience</title>
    <!-- Official Google model-viewer for WebXR real-world spatial AR -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #09090b; overflow: hidden; width: 100vw; height: 100vh; font-family: system-ui, -apple-system, sans-serif; color: #f4f4f5; }

      model-viewer {
        width: 100vw; height: 100vh;
        outline: none; display: block;
      }

      /* AR Launch Floating Action Pill */
      .ar-launch-pill {
        position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
        z-index: 999; display: flex; align-items: center; justify-content: center;
      }

      .ar-btn {
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: #09090b; font-weight: 900; font-size: 14px;
        letter-spacing: 0.05em; padding: 14px 32px; border-radius: 99px;
        border: none; cursor: pointer;
        box-shadow: 0 0 30px rgba(245,158,11,0.5);
        display: flex; align-items: center; gap: 10px;
        text-transform: uppercase; transition: transform 0.15s ease;
      }
      .ar-btn:active { transform: scale(0.95); }

      /* Fullscreen Loader */
      #ar-loader {
        position: fixed; inset: 0; z-index: 9999;
        background: #09090b;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px; color: #f4f4f5; text-align: center; padding: 24px;
      }
      .spinner {
        border: 3px solid #27272a; border-top: 3px solid #f59e0b;
        border-radius: 50%; width: 38px; height: 38px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loader-title { font-size: 15px; font-weight: 700; color: #f59e0b; letter-spacing: 0.05em; }
      .loader-sub { font-size: 13px; color: #a1a1aa; max-width: 260px; line-height: 1.4; }
    </style>
  </head>
  <body>

    <!-- Fullscreen Loader -->
    <div id="ar-loader">
      <div class="spinner"></div>
      <div class="loader-title">Preparing 3D AR Model...</div>
      <div class="loader-sub">Decompressing model & launching WebXR spatial anchor</div>
    </div>

    <!-- 3D & WebXR AR Viewer -->
    <model-viewer
      id="viewer"
      camera-controls
      auto-rotate
      shadow-intensity="1.5"
      exposure="1.2"
      loading="eager"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="auto"
      ar-placement="floor"
    >
      <div class="ar-launch-pill" slot="ar-button">
        <button class="ar-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          Place Dish in Your Environment
        </button>
      </div>
    </model-viewer>

    <script>
      const loader = document.getElementById('ar-loader');
      const viewer = document.getElementById('viewer');
      const urlParams = new URLSearchParams(window.location.search);
      const modelUrl = urlParams.get('modelUrl');

      async function initAR() {
        if (!modelUrl) {
          loader.innerHTML = '<div style="color:#ef4444;font-weight:700;">Error: No model URL provided</div>';
          return;
        }

        try {
          let finalUrl = modelUrl;

          // Decompress .gz binary into Object URL if needed
          if (modelUrl.endsWith('.gz')) {
            const response = await fetch(modelUrl);
            const decompressedStream = response.body.pipeThrough(new DecompressionStream('gzip'));
            const blob = await new Response(decompressedStream, {
              headers: { 'Content-Type': 'model/gltf-binary' }
            }).blob();
            finalUrl = URL.createObjectURL(blob) + '#.glb';
          }

          viewer.src = finalUrl;

          // Scale configuration
          if (modelUrl.toLowerCase().includes('burger')) {
            viewer.scale = '0.17 0.17 0.17';
          } else if (modelUrl.toLowerCase().includes('pizza')) {
            viewer.scale = '0.22 0.22 0.22';
          } else {
            viewer.scale = '0.17 0.17 0.17';
          }

          viewer.addEventListener('load', () => {
            loader.style.display = 'none';
            // Auto-trigger native WebXR camera mode
            setTimeout(() => {
              try {
                viewer.activateAR();
              } catch (e) {
                console.log('AR ready');
              }
            }, 300);
          });

          // Safety fallback: hide loader after 5s max
          setTimeout(() => {
            if (loader.style.display !== 'none') {
              loader.style.display = 'none';
            }
          }, 5000);

        } catch (err) {
          console.error('AR error:', err);
          loader.innerHTML = '<div style="color:#ef4444;font-weight:700;">Failed to load 3D model</div>';
        }
      }

      initAR();
    </script>
  </body>
</html>
