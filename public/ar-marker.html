<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MenuVerse Live Marker AR</title>
    <!-- A-Frame 1.3.0 -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for real-time camera marker tracking -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; font-family: system-ui, -apple-system, sans-serif; }

      /* Fullscreen AR Loader */
      #ar-loader {
        position: fixed; inset: 0; z-index: 9999;
        background: #09090b;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px; color: #f4f4f5; text-align: center; padding: 24px;
      }
      .spinner {
        border: 3px solid #27272a; border-top: 3px solid #f59e0b;
        border-radius: 50%; width: 38px; height: 38px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loader-title { font-size: 15px; font-weight: 700; color: #f59e0b; letter-spacing: 0.05em; }
      .loader-sub { font-size: 13px; color: #a1a1aa; max-width: 260px; line-height: 1.4; }

      /* Live AR Camera Status Bar */
      .ar-status-bar {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        background: rgba(9, 9, 11, 0.85);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(245, 158, 11, 0.4);
        color: #f4f4f5; padding: 10px 22px; border-radius: 99px;
        font-size: 13px; font-weight: 600; text-align: center;
        z-index: 999; pointer-events: auto;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        white-space: nowrap; display: flex; align-items: center; gap: 8px;
      }
      .ar-status-bar span { color: #f59e0b; font-weight: 700; }

      .re-lock-btn {
        background: rgba(245, 158, 11, 0.2); border: 1px solid rgba(245, 158, 11, 0.5);
        color: #f59e0b; padding: 4px 10px; border-radius: 12px;
        font-size: 11px; font-weight: 700; cursor: pointer; margin-left: 6px;
      }
    </style>
  </head>
  <body>

    <!-- Fullscreen AR Loader -->
    <div id="ar-loader">
      <div class="spinner"></div>
      <div class="loader-title">Opening Live AR Camera...</div>
      <div class="loader-sub">Loading 3D model & preparing camera tracking</div>
    </div>

    <!-- Live Status Pill -->
    <div class="ar-status-bar" id="status-pill">
      <span id="status-text">Point camera at the <span>MenuVerse Marker</span></span>
      <button class="re-lock-btn" id="re-lock-btn" style="display:none" onclick="location.reload()">Reset Position</button>
    </div>

    <!-- AR.js Real-time Tracking Scene Over Live Webcam -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true;"
      vr-mode-ui="enabled: false"
    >
      <!-- Custom MenuVerse Pattern Marker -->
      <a-marker
        type="pattern"
        url="/logo.patt"
        patternRatio="0.75"
        id="custom-marker"
        smooth="true"
        smoothCount="8"
        smoothTolerance="0.01"
        smoothThreshold="3"
      >
        <a-entity id="custom-model" position="0 0.3 0" scale="1 1 1"></a-entity>
      </a-marker>

      <!-- Standard Hiro Marker Fallback -->
      <a-marker
        preset="hiro"
        id="hiro-marker"
        smooth="true"
        smoothCount="8"
        smoothTolerance="0.01"
        smoothThreshold="3"
      >
        <a-entity id="hiro-model" position="0 0.3 0" scale="1 1 1"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const loader = document.getElementById('ar-loader');
      const statusText = document.getElementById('status-text');
      const reLockBtn = document.getElementById('re-lock-btn');
      const urlParams = new URLSearchParams(window.location.search);
      const modelUrl = urlParams.get('modelUrl');

      let isAnchored = false;

      // Lock 3D model position in world space once marker is detected so it never vanishes
      function lockModelAnchor(marker, entity) {
        if (isAnchored) return;
        isAnchored = true;

        try {
          const worldPos = new THREE.Vector3();
          const worldQuaternion = new THREE.Quaternion();
          const worldScale = new THREE.Vector3();

          marker.object3D.matrixWorld.decompose(worldPos, worldQuaternion, worldScale);

          // Re-parent model to scene root so markerLost won't hide it
          const scene = document.querySelector('a-scene');
          scene.object3D.add(entity.object3D);

          entity.object3D.position.copy(worldPos);
          entity.object3D.quaternion.copy(worldQuaternion);
          entity.object3D.visible = true;

          statusText.innerHTML = '✓ <span style="color:#10b981">Model Fixed on Marker!</span>';
          reLockBtn.style.display = 'inline-block';
        } catch (e) {
          console.log('Anchor lock:', e);
        }
      }

      async function initAR() {
        if (!modelUrl) {
          loader.innerHTML = '<div style="color:#ef4444;font-weight:700;">Error: No model URL provided</div>';
          return;
        }

        try {
          let finalUrl = modelUrl;

          // Decompress .gz binary into Object URL if needed
          if (modelUrl.endsWith('.gz')) {
            const response = await fetch(modelUrl);
            const decompressedStream = response.body.pipeThrough(new DecompressionStream('gzip'));
            const blob = await new Response(decompressedStream, {
              headers: { 'Content-Type': 'model/gltf-binary' }
            }).blob();
            finalUrl = URL.createObjectURL(blob) + '#.glb';
          }

          // Scale parameters
          let scaleStr = '1.5 1.5 1.5';
          let posStr = '0 0.3 0';

          if (modelUrl.toLowerCase().includes('burger')) {
            scaleStr = '1.8 1.8 1.8';
            posStr = '0 0.4 0';
          } else if (modelUrl.toLowerCase().includes('pizza')) {
            scaleStr = '0.25 0.25 0.25';
            posStr = '0 0.1 0';
          }

          const customMarker = document.getElementById('custom-marker');
          const hiroMarker = document.getElementById('hiro-marker');
          const customModel = document.getElementById('custom-model');
          const hiroModel = document.getElementById('hiro-model');

          [customModel, hiroModel].forEach(entity => {
            entity.setAttribute('gltf-model', finalUrl);
            entity.setAttribute('scale', scaleStr);
            entity.setAttribute('position', posStr);
            entity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear');
          });

          // Persistent Anchor Locking
          customMarker.addEventListener('markerFound', () => lockModelAnchor(customMarker, customModel));
          hiroMarker.addEventListener('markerFound', () => lockModelAnchor(hiroMarker, hiroModel));

          // Hide loader when model is parsed
          customModel.addEventListener('model-loaded', () => loader.style.display = 'none');
          hiroModel.addEventListener('model-loaded', () => loader.style.display = 'none');

          setTimeout(() => {
            if (loader.style.display !== 'none') {
              loader.style.display = 'none';
            }
          }, 5000);

        } catch (err) {
          console.error('AR init error:', err);
          loader.innerHTML = '<div style="color:#ef4444;font-weight:700;">Failed to load 3D model</div>';
        }
      }

      initAR();
    </script>
  </body>
</html>
