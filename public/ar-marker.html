<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>MenuVerse QR AR</title>
    <!-- jsQR for reliable QR code detection -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <!-- A-Frame + AR.js for 3D rendering -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: system-ui, -apple-system, sans-serif; }

      /* Camera feed canvas (hidden, used for QR scanning) */
      #qr-canvas { display: none; }

      /* Live video element */
      #camera-video {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        z-index: 1;
      }

      /* Scanning overlay */
      #scan-overlay {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        pointer-events: none;
      }

      /* Scan frame */
      .scan-frame {
        width: min(260px, 65vw); height: min(260px, 65vw);
        position: relative;
      }
      .corner {
        position: absolute; width: 28px; height: 28px;
        border-color: #f59e0b; border-style: solid;
      }
      .corner.tl { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
      .corner.tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
      .corner.bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
      .corner.br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

      /* Scan line animation */
      .scan-line {
        position: absolute; left: 4px; right: 4px; height: 2px;
        background: linear-gradient(90deg, transparent, #f59e0b, transparent);
        animation: scan 2s linear infinite;
        border-radius: 1px;
        box-shadow: 0 0 8px #f59e0b;
      }
      @keyframes scan {
        0% { top: 4px; } 100% { top: calc(100% - 6px); }
      }

      .scan-hint {
        margin-top: 20px;
        color: rgba(255,255,255,0.8);
        font-size: 13px; font-weight: 500;
        text-align: center;
        text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        letter-spacing: 0.02em;
      }
      .scan-hint span { color: #f59e0b; font-weight: 700; }

      /* Found indicator */
      #found-badge {
        display: none;
        position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
        background: rgba(16,185,129,0.95); color: #fff;
        font-size: 13px; font-weight: 700;
        padding: 8px 20px; border-radius: 99px;
        z-index: 100; letter-spacing: 0.05em;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        animation: pop 0.3s ease;
      }
      @keyframes pop { 0% { transform: translateX(-50%) scale(0.7); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }

      /* 3D model overlay using model-viewer in AR mode */
      #model-container {
        display: none;
        position: fixed; inset: 0; z-index: 50;
        background: transparent;
      }

      /* Loading spinner */
      #loader {
        position: fixed; inset: 0; z-index: 200;
        background: rgba(9,9,11,0.96);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px; color: #f4f4f5;
      }
      .spinner {
        border: 3px solid #27272a; border-top: 3px solid #f59e0b;
        border-radius: 50%; width: 36px; height: 36px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loader-text { font-size: 13px; font-weight: 600; letter-spacing: 0.05em; color: #a1a1aa; }

      /* A-Frame scene */
      a-scene { position: fixed; inset: 0; z-index: 5; }
    </style>
  </head>
  <body>

    <!-- Camera loader -->
    <div id="loader">
      <div class="spinner"></div>
      <div class="loader-text">Starting camera...</div>
    </div>

    <!-- QR detected badge -->
    <div id="found-badge">✓ QR Detected — Loading model...</div>

    <!-- Live camera feed -->
    <video id="camera-video" autoplay muted playsinline></video>

    <!-- Hidden canvas for frame capture -->
    <canvas id="qr-canvas"></canvas>

    <!-- Scanning UI overlay -->
    <div id="scan-overlay">
      <div class="scan-frame">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="scan-line"></div>
      </div>
      <div class="scan-hint">Point at the <span>MenuVerse QR</span> marker</div>
    </div>

    <!-- A-Frame AR scene (activated after QR detected) -->
    <a-scene
      id="ar-scene"
      style="display:none"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
      renderer="logarithmicDepthBuffer: true; antialias: true;"
      vr-mode-ui="enabled: false"
    >
      <a-marker
        type="pattern"
        url="/logo.patt"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"
      >
        <a-entity id="ar-model" position="0 0 0" scale="1 1 1"></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('camera-video');
      const canvas = document.getElementById('qr-canvas');
      const ctx = canvas.getContext('2d');
      const loader = document.getElementById('loader');
      const foundBadge = document.getElementById('found-badge');
      const scanOverlay = document.getElementById('scan-overlay');

      const urlParams = new URLSearchParams(window.location.search);
      const modelUrl = urlParams.get('modelUrl');

      let qrDetected = false;
      let animationId = null;

      // ── Start camera ────────────────────────────────────────────────────
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
          video.srcObject = stream;
          video.onloadedmetadata = () => {
            video.play();
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            loader.style.display = 'none';
            scanLoop();
          };
        } catch (err) {
          loader.innerHTML = '<div style="color:#ef4444;font-size:14px;font-weight:600;text-align:center;padding:24px;">Camera access denied.<br>Please allow camera permission and reload.</div>';
        }
      }

      // ── QR scanning loop ─────────────────────────────────────────────────
      function scanLoop() {
        if (qrDetected) return;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'dontInvert'
        });

        if (code) {
          onQRDetected(code.data);
          return;
        }
        animationId = requestAnimationFrame(scanLoop);
      }

      // ── QR detected handler ──────────────────────────────────────────────
      function onQRDetected(data) {
        if (qrDetected) return;
        qrDetected = true;

        // Flash the scan frame green
        document.querySelectorAll('.corner').forEach(c => c.style.borderColor = '#10b981');
        document.querySelector('.scan-line').style.background = 'linear-gradient(90deg, transparent, #10b981, transparent)';

        // Show found badge
        foundBadge.style.display = 'block';

        // Switch to A-Frame AR scene after brief delay
        setTimeout(() => {
          scanOverlay.style.display = 'none';
          video.style.display = 'none';
          foundBadge.style.display = 'none';

          const scene = document.getElementById('ar-scene');
          scene.style.display = 'block';

          // Load model into the A-Frame entity
          const modelEntity = document.getElementById('ar-model');
          if (modelUrl) {
            modelEntity.setAttribute('gltf-model', 'url(' + modelUrl + ')');
            // Scale based on model type
            if (modelUrl.toLowerCase().includes('burger')) {
              modelEntity.setAttribute('scale', '1.75 1.75 1.75');
              modelEntity.setAttribute('position', '0 0.5 0');
            } else if (modelUrl.toLowerCase().includes('pizza')) {
              modelEntity.setAttribute('scale', '0.2 0.2 0.2');
              modelEntity.setAttribute('position', '0 0.1 0');
            } else {
              modelEntity.setAttribute('scale', '1.0 1.0 1.0');
              modelEntity.setAttribute('position', '0 0.5 0');
            }
            modelEntity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear');
          }
        }, 600);
      }

      startCamera();
    </script>
  </body>
</html>
