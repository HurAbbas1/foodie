<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Marker AR | A-Frame & AR.js</title>
    <!-- Include A-Frame and AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body {
        margin: 0px;
        overflow: hidden;
      }
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(9, 9, 11, 0.95); /* Zinc 950 */
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #f4f4f5; /* Zinc 100 */
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      .spinner {
        border: 3px solid #27272a; /* Zinc 800 */
        border-top: 3px solid #f59e0b; /* Amber 500 */
        border-radius: 50%;
        width: 32px;
        height: 32px;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      /* UI Overlay instruction */
      .ui-overlay {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(9, 9, 11, 0.85); /* Zinc 950 with opacity */
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #f4f4f5;
        padding: 12px 24px;
        border-radius: 9999px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 500;
        text-align: center;
        z-index: 100;
        pointer-events: none;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        white-space: nowrap;
      }
      .highlight {
        color: #f59e0b; /* Amber 500 */
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <!-- Custom Loader -->
    <div id="loader" class="arjs-loader">
      <div class="spinner"></div>
      <div>Plating 3D AR Scene...</div>
    </div>

    <!-- UI instruction -->
    <div class="ui-overlay">
      Point your camera at a <span class="highlight">HIRO Marker</span>
    </div>

    <!-- AR Scene -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
      renderer="logarithmicDepthBuffer: true; antialias: true; precision: medium; colorManagement: true;"
      vr-mode-ui="enabled: false"
    >
      <!-- Preset Hiro Marker -->
      <a-marker preset="hiro" id="hiro-marker">
        <!-- The model container inside the marker (direct child for rock-solid tracking) -->
        <a-entity
          id="model"
          position="0 0 0"
          scale="1 1 1"
          rotation="0 0 0"
        ></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Extract modelUrl from query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const modelUrl = urlParams.get('modelUrl');

      if (modelUrl) {
        const modelEntity = document.getElementById('model');
        // Set the gltf-model attribute dynamically
        modelEntity.setAttribute('gltf-model', 'url(' + modelUrl + ')');

        // Adjust scale based on model type
        if (modelUrl.toLowerCase().includes('burger')) {
          modelEntity.setAttribute('scale', '1.75 1.75 1.75');
          modelEntity.setAttribute('position', '0 0.5 0'); // sits perfectly on the card surface
          // Add gentle rotation animation
          modelEntity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear');
        } else if (modelUrl.toLowerCase().includes('pizza')) {
          modelEntity.setAttribute('scale', '0.2 0.2 0.2');
          modelEntity.setAttribute('position', '0 0.1 0');
          // Add gentle rotation animation
          modelEntity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear');
        } else {
          modelEntity.setAttribute('scale', '1.0 1.0 1.0');
          modelEntity.setAttribute('position', '0 0.5 0');
          modelEntity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear');
        }

        // Hide loader when model is parsed and loaded
        modelEntity.addEventListener('model-loaded', () => {
          document.getElementById('loader').style.display = 'none';
        });

        // Fallback: hide loader after 15s anyway in case event misses
        setTimeout(() => {
          const loader = document.getElementById('loader');
          if (loader.style.display !== 'none') {
            loader.style.display = 'none';
          }
        }, 15000);
      } else {
        document.getElementById('loader').innerHTML = '<div style="color:#ef4444">Error: No model URL provided</div>';
      }
    </script>
  </body>
</html>
