<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MenuVerse Real-Time AR Marker</title>
    <!-- A-Frame 1.3.0 -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for real-time camera marker tracking -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: system-ui, -apple-system, sans-serif; }

      /* Loading Screen */
      #ar-loader {
        position: fixed; inset: 0; z-index: 9999;
        background: #09090b;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px; color: #f4f4f5; text-align: center; padding: 24px;
      }
      .spinner {
        border: 3px solid #27272a; border-top: 3px solid #f59e0b;
        border-radius: 50%; width: 38px; height: 38px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loader-title { font-size: 15px; font-weight: 700; color: #f59e0b; letter-spacing: 0.05em; }
      .loader-sub { font-size: 13px; color: #a1a1aa; max-width: 260px; line-height: 1.4; }

      /* Real-time AR Instruction Pill */
      .ar-instruction-pill {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        background: rgba(9, 9, 11, 0.85);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(245, 158, 11, 0.3);
        color: #f4f4f5; padding: 10px 22px; border-radius: 99px;
        font-size: 13px; font-weight: 600; text-align: center;
        z-index: 999; pointer-events: auto;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        white-space: nowrap; display: flex; items-center; gap: 8px;
      }
      .ar-instruction-pill span { color: #f59e0b; font-weight: 700; }

      .reset-btn {
        background: rgba(245, 158, 11, 0.2); border: 1px solid rgba(245, 158, 11, 0.4);
        color: #f59e0b; padding: 4px 10px; border-radius: 12px;
        font-size: 11px; font-weight: 700; cursor: pointer; margin-left: 8px;
      }
    </style>
  </head>
  <body>

    <!-- Loading Screen -->
    <div id="ar-loader">
      <div class="spinner"></div>
      <div class="loader-title">Preparing 3D AR Experience...</div>
      <div class="loader-sub">Decompressing model & initializing camera tracking</div>
    </div>

    <!-- Live AR Overlay Guide -->
    <div class="ar-instruction-pill" id="pill">
      <span id="pill-text">Point camera at <span>MenuVerse Marker</span></span>
      <button class="reset-btn" id="reset-btn" style="display:none" onclick="resetAnchor()">Re-lock</button>
    </div>

    <!-- AR.js Real-time Tracking Scene -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true;"
      vr-mode-ui="enabled: false"
    >
      <!-- Custom MenuVerse Pattern Marker (ratio matches pattern border) -->
      <a-marker
        type="pattern"
        url="/logo.patt"
        patternRatio="0.75"
        id="custom-marker"
        smooth="true"
        smoothCount="8"
        smoothTolerance="0.01"
        smoothThreshold="3"
      >
        <a-entity id="custom-model" position="0 0.2 0" scale="1 1 1"></a-entity>
      </a-marker>

      <!-- Standard Hiro Marker Fallback -->
      <a-marker
        preset="hiro"
        id="hiro-marker"
        smooth="true"
        smoothCount="8"
        smoothTolerance="0.01"
        smoothThreshold="3"
      >
        <a-entity id="hiro-model" position="0 0.2 0" scale="1 1 1"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const loader = document.getElementById('ar-loader');
      const pillText = document.getElementById('pill-text');
      const resetBtn = document.getElementById('reset-btn');
      const urlParams = new URLSearchParams(window.location.search);
      const modelUrl = urlParams.get('modelUrl');

      let isAnchored = false;
      let activeModelEntity = null;

      function lockAnchor(marker, entity) {
        if (isAnchored) return;
        isAnchored = true;

        // Decompose world position & rotation of the marker at this moment
        const worldPos = new THREE.Vector3();
        const worldQuaternion = new THREE.Quaternion();
        const worldScale = new THREE.Vector3();

        marker.object3D.matrixWorld.decompose(worldPos, worldQuaternion, worldScale);

        // Move the entity directly to the <a-scene> root so markerLost won't hide it!
        const scene = document.querySelector('a-scene');
        scene.object3D.add(entity.object3D);

        // Set fixed world position and rotation
        entity.object3D.position.copy(worldPos);
        entity.object3D.quaternion.copy(worldQuaternion);
        entity.object3D.visible = true;

        activeModelEntity = entity;

        // Update UI status pill
        pillText.innerHTML = '✓ <span style="color:#10b981">Model Locked in 3D Space!</span>';
        resetBtn.style.display = 'inline-block';
      }

      function resetAnchor() {
        isAnchored = false;
        location.reload();
      }

      async function initAR() {
        if (!modelUrl) {
          loader.innerHTML = '<div style="color:#ef4444;font-weight:700;">Error: No model URL provided</div>';
          return;
        }

        try {
          let finalModelUrl = modelUrl;

          // Decompress .gz binary into Object URL if needed
          if (modelUrl.endsWith('.gz')) {
            const response = await fetch(modelUrl);
            const decompressedStream = response.body.pipeThrough(new DecompressionStream('gzip'));
            const blob = await new Response(decompressedStream, {
              headers: { 'Content-Type': 'model/gltf-binary' }
            }).blob();
            finalModelUrl = URL.createObjectURL(blob) + '#.glb';
          }

          // Scale & Animation parameters
          let scaleStr = '1.5 1.5 1.5';
          let posStr = '0 0.3 0';

          if (modelUrl.toLowerCase().includes('burger')) {
            scaleStr = '1.8 1.8 1.8';
            posStr = '0 0.4 0';
          } else if (modelUrl.toLowerCase().includes('pizza')) {
            scaleStr = '0.25 0.25 0.25';
            posStr = '0 0.1 0';
          }

          const customMarker = document.getElementById('custom-marker');
          const hiroMarker = document.getElementById('hiro-marker');
          const customModel = document.getElementById('custom-model');
          const hiroModel = document.getElementById('hiro-model');

          [customModel, hiroModel].forEach(entity => {
            entity.setAttribute('gltf-model', finalModelUrl);
            entity.setAttribute('scale', scaleStr);
            entity.setAttribute('position', posStr);
            entity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear');
          });

          // Attach Persistent Anchor Locking to both markers
          customMarker.addEventListener('markerFound', () => lockAnchor(customMarker, customModel));
          hiroMarker.addEventListener('markerFound', () => lockAnchor(hiroMarker, hiroModel));

          // Hide loader screen when model finishes loading
          customModel.addEventListener('model-loaded', () => loader.style.display = 'none');
          hiroModel.addEventListener('model-loaded', () => loader.style.display = 'none');

          setTimeout(() => {
            if (loader.style.display !== 'none') {
              loader.style.display = 'none';
            }
          }, 6000);

        } catch (err) {
          console.error('AR initialization error:', err);
          loader.innerHTML = '<div style="color:#ef4444;font-weight:700;">Failed to load 3D model</div>';
        }
      }

      initAR();
    </script>
  </body>
</html>
